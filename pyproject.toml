[project]
name = "k-dimensional-tree"
version = "0.1.0"
description = "Pure Python k-d tree implementation for nearest-neighbor and range queries using only the standard library."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
